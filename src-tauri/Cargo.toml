[package]
name = "arculus-recovery-tauri"
version = "1.5.0"
description = "Offline Arculus Recovery desktop app"
authors = ["Arculus Recovery"]
edition = "2021"

[lib]
name = "arculus_recovery_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "arculus-recovery"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
tauri = { version = "2", features = [] }
