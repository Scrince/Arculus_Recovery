name: Build Tauri Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest
          - ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Prepare Tauri assets on Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-tauri-assets.ps1

      - name: Prepare Tauri assets on macOS and Linux
        if: matrix.platform != 'windows-latest'
        run: python3 scripts/prepare_tauri_assets.py

      - name: Run Windows Tauri release preflight
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./tests/tauri/windows-release-harness.ps1 -SkipRustTests

      - name: Run macOS Tauri release preflight
        if: matrix.platform == 'macos-latest'
        run: bash tests/tauri/macos-release-harness.sh --skip-rust-tests

      - name: Run Linux Tauri release preflight
        if: matrix.platform == 'ubuntu-22.04'
        run: bash tests/tauri/linux-release-harness.sh --skip-rust-tests

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yellowsphere-${{ matrix.platform }}
          path: |
            src-tauri/target/release/yellowsphere*
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
